<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amarpal Singh Tumber</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Noto+Sans+Symbols+2&display=swap" rel="stylesheet">
<style>
:root{--ivory:#f6f1e7;--navy:#16356b;--ink:#0c2340;--mist:#5e6b80}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ink);color:var(--navy);font-family:"Cormorant Garamond",Palatino,Georgia,serif}
.frame{height:100dvh;display:flex;flex-direction:column}
.wrap{flex:1;min-height:0;margin:8px;border:1px dotted rgba(246,241,231,.85);padding:8px}
.stage{height:100%;border:1px solid rgba(246,241,231,.5);background:var(--ivory);padding:4px}
.inner{position:relative;height:100%;border:1px solid var(--navy);overflow:hidden}
.cover{height:100%;display:flex;flex-direction:column;align-items:center;text-align:center;padding:12px 16px}
.mark{font-family:"Noto Sans Symbols 2",serif;font-size:34px;line-height:1;color:var(--navy)}
.slot{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;margin-top:8px}
.slot img{height:100%;width:auto;max-width:92%;object-fit:cover;border-radius:50%}
.eyebrow{margin:8px 0 0;font-size:1.35rem;font-style:italic}
h1{margin:0;color:var(--ink);font-size:clamp(2rem,5vw,3.2rem);font-weight:600;line-height:1}
.when{margin:8px 0 0;color:var(--mist);font-size:1.15rem;line-height:1.25}
.note{margin:8px 0 0}
#slides{position:absolute;inset:0;z-index:2}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.8s ease-in-out}
.bar{display:flex;justify-content:center;gap:2px;padding:2px 8px 6px}
button{border:0;background:transparent;color:rgba(246,241,231,.4);font:inherit;font-size:.9rem;line-height:1;cursor:pointer;padding:2px 8px}
button[aria-pressed="true"]{background:transparent;color:var(--ivory)}
@media (prefers-reduced-motion:reduce){.photo{transition:none}}
</style>
</head>
<body>
<div class="frame">
  <div class="wrap"><div class="stage"><div class="inner" id="inner"></div></div></div>
  <div class="bar">
    <button id="play" type="button">Play</button>
    <button id="pause" type="button">Pause</button>
    <button id="stop" type="button" aria-pressed="true">Stop</button>
  </div>
</div>
<script>
const FADE=1800, DWELL=7000;
const inner=document.getElementById("inner");
const buttons={playing:document.getElementById("play"),paused:document.getElementById("pause"),stopped:document.getElementById("stop")};
let mode="stopped",photos=[],index=0,timer=null,portrait="",slides=null;
function cover(note){
  if(!document.getElementById("cover")){
    const pic=portrait?'<img alt="Portrait of Amarpal Singh Tumber" src="'+portrait+'">':'';
    inner.innerHTML='<div class="cover" id="cover"><div class="mark">\u262C</div><div class="slot">'+pic+'</div><p class="eyebrow">In Loving Memory of</p><h1>Amarpal Singh Tumber</h1><p class="when">Tuesday, September 29 \u00b7 11:00 AM<br>Ullrey Memorial Chapel</p><p class="note" id="note"></p></div><div id="slides"></div>';
    slides=document.getElementById("slides");
  } else if(portrait && !document.querySelector("#cover .slot img")){
    document.querySelector("#cover .slot").innerHTML='<img alt="Portrait of Amarpal Singh Tumber" src="'+portrait+'">';
  }
  const noteEl=document.getElementById("note");
  if(noteEl) noteEl.textContent=note||"";
}
function showPhoto(src){
  const img=document.createElement("img");
  img.className="photo";
  img.alt="Photograph in memory of Amarpal Singh Tumber";
  img.src=src;
  slides.appendChild(img);
  const older=[...slides.querySelectorAll(".photo")].filter(el=>el!==img);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{img.style.opacity="1"}));
  older.forEach(el=>{el.style.opacity="0"});
  setTimeout(()=>older.forEach(el=>el.remove()),FADE+80);
}
function clearPhotos(){
  if(!slides) return;
  [...slides.querySelectorAll(".photo")].forEach(el=>{el.style.opacity="0"});
  setTimeout(()=>{if(slides) slides.replaceChildren()},FADE+80);
}
function setMode(next){mode=next;for(const k in buttons)buttons[k].setAttribute("aria-pressed",k===mode?"true":"false")}
function clearTimer(){if(timer){clearInterval(timer);timer=null}}
async function loadPhotos(){
  const res=await fetch("https://api.github.com/repos/vsgellon/amarpal-singh-tumber/contents/photos?ref=main",{headers:{Accept:"application/vnd.github+json"}});
  if(!res.ok)return[];
  const items=await res.json();
  if(!Array.isArray(items))return[];
  const stamp=Date.now();
  return items.filter(i=>i.type==="file"&&/\.(jpe?g|png|gif|webp|avif)$/i.test(i.name)&&i.download_url).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true})).map(i=>i.download_url+"?v="+stamp);
}
document.getElementById("play").onclick=async()=>{
  if(mode==="paused"&&photos.length){setMode("playing");if(photos.length>1)timer=setInterval(()=>{index=(index+1)%photos.length;showPhoto(photos[index])},DWELL);return}
  photos=await loadPhotos().catch(()=>[]);
  if(!photos.length){setMode("stopped");cover("Photographs will appear here once they are added.");return}
  index=0;setMode("playing");showPhoto(photos[0]);clearTimer();
  if(photos.length>1)timer=setInterval(()=>{index=(index+1)%photos.length;showPhoto(photos[index])},DWELL);
};
document.getElementById("pause").onclick=()=>{if(mode!=="playing")return;clearTimer();setMode("paused")};
document.getElementById("stop").onclick=()=>{clearTimer();photos=[];index=0;setMode("stopped");clearPhotos();cover("")};
fetch("https://raw.githubusercontent.com/vsgellon/amarpal-singh-tumber/main/portrait.b64").then(r=>r.text()).then(t=>{portrait="data:image/jpeg;base64,"+t.trim();cover("")}).catch(()=>{});
cover("");
</script>
</body>
</html>
